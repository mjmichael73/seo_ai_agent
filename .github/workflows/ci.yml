name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test with full coverage
        shell: bash
        run: |
          set +e
          pytest --cov=seo_ai_agent --cov-report=term-missing --cov-fail-under=100 > test-output.txt 2>&1
          test_status=$?
          echo "### Pytest output" >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 test-output.txt >> "$GITHUB_STEP_SUMMARY"
          cat test-output.txt
          exit "$test_status"
