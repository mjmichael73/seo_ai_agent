services:
  seo-ai-agent:
    build:
      context: .
    image: seo-ai-agent:latest
    container_name: seo-ai-agent
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-SEO AI Agent}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-8}
      SEARCH_TIMEOUT: ${SEARCH_TIMEOUT:-8}
      MAX_PAGES: ${MAX_PAGES:-20}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-2000000}
      MAX_REDIRECTS: ${MAX_REDIRECTS:-3}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
